name: Validate Part 1 Docs

# Part 1 has no application code to build yet, so this workflow
# validates that the required planning artefacts exist in /docs.

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "::error::/docs folder is missing"
            exit 1
          fi
          echo "docs folder found."

      - name: Verify required planning documents exist
        run: |
          missing=0

          # ERD (PNG or PDF) - the DBML source is also accepted
          if ! ls docs/*.png docs/*.pdf docs/*.dbml >/dev/null 2>&1; then
            echo "::error::No ERD file (.png/.pdf/.dbml) found in /docs"
            missing=1
          fi

          # API endpoint plan (Markdown or PDF)
          if ! ls docs/*api*endpoint*plan*.md docs/*api*endpoint*plan*.pdf >/dev/null 2>&1; then
            echo "::error::API endpoint plan not found in /docs"
            missing=1
          fi

          # SQL script
          if ! ls docs/*.sql >/dev/null 2>&1; then
            echo "::error::No SQL script (.sql) found in /docs"
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            echo "One or more required documents are missing."
            exit 1
          fi
          echo "All required Part 1 documents are present."

      - name: Summary
        run: echo "Part 1 documentation validation passed."
